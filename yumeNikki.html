<!DOCTYPE html>
<html lang="es">
    <head>
        <title>MyStuff</title>
        <meta charset="UTF-8">
        <link rel="icon" href="./imagenes/bola.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="./css/estilos.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    </head>
    <body>
    
        <!-- Scroll Horizontal -->
        <div class="scroll-h"></div>

        <!-- Header -->
        <script src="./js/header.js"></script>

        <!-- Contenido -->
        <main>

            <!-- Titulos -->
            <div class="titulos centro">
                <p class="titulos__titulo">Yume Nikki</p>
                <p class="titulos__subtitulo">Yume Nikki para 3DS en Español.</p>
            </div>

            <!-- Tarjetas -->
            <article class="tarjetas vertical">

                <!-- Tarjeta -->
                <section class="tarjeta">

                    <!-- Informacion -->
                    <div class="tarjeta__informacion">
                        <p class="tarjeta__titulo">Informacion</p>
                        <p class="tarjeta__descripcion">
                            Yume Nikki es un Juego Indie Donde Tienes que Explorar los Sueños de Madotsuki y Poder Conseguir los 
                            25 Efectos para Poder Desbloquear el Final del Juego... Este Juego Fue Traducido al Español para la 3DS.
                        </p>

                        <!-- Slider -->
                        <div class="slider" id="slider1">
                            <div class="slider__imagenes">
                                <img src="./imagenes/3ds/yumeNikki/yume_nikki_banner.jpg" alt="imagen" class="slider__imagen">
                            </div>

                            <!-- Botones Slider -->
                            <ion-icon name="chevron-back-outline" class="slider-boton boton-izquierda" onclick="moverIzquierda('slider1')"></ion-icon>
                            <ion-icon name="chevron-forward-outline" class="slider-boton boton-derecha" onclick="moverDerecha('slider1')"></ion-icon>
                        </div>

                        <!-- Boton Descargar -->
                        <div class="div__boton">
                            <a href="https://mega.nz/file/86hAUDLS#oMI68OqGBBodWvND8I9OM_3ZEFYBJ7QSDcmrHM0PvD8" target="_blank" class="boton descargar">
                                Descargar CIA
                                <ion-icon name="download-outline"></ion-icon>
                            </a>
                        </div>

                    </div>
                    
                </section>

            </article>

            <!-- Boton Subir -->
            <a href="#" class="boton-subir">
                <ion-icon name="arrow-up-outline"></ion-icon>
            </a>

        </main>

        <!-- Footer -->
        <script src="./js/footer.js"></script>

        <!--

			\____/\
			/\  /\

        -->
        
    </body>
</html>
